# Weekly update PRs. Each PR runs CI and the scans before it can merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Pacific/Auckland
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades (Next.js, Prisma, React) are planned changes, not
    # weekly churn. Security updates still arrive via Dependabot alerts.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Pacific/Auckland
    groups:
      actions:
        patterns: ["*"]
